<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        fieldset {
            font-family: Arial, Helvetica, sans-serif;
            background-color: whitesmoke;
            color: black;
            border: 1px solid black;
        }

        .primeiro {
            margin: 10px;
            padding: 10px;
            border: 1px dashed black;
            font-weight: bolder;
            text-align: center;
        }

        .negrito {
            font-weight: bolder;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get">
        <fieldset>
            <legend class="primeiro">Dados Pessoais</legend>
            <p>
                <label for="inome" class="negrito">Nome:</label>
                <input type="text" name="nome" id="inome" minlength="5" maxlength="20" required>
            </p>
            <p>
                <label for="iemail" class="negrito">Email:</label>
                <input type="email" name="email" id="iemail" autocomplete="email" required placeholder="...@....">
            </p>
            <p>
                <label for="itel" class="negrito">Telefone:</label>
                <input type="tel" name="tel" id="itel" autocomplete="tel" pattern="^\(d{2})\d{4,4}-\d{4}$" required placeholder="(xx)xxxx-xxxx">
            </p>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    
</body>
</html>
